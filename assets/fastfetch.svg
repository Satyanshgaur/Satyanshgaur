<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; rx: 12px; stroke: #30363d; stroke-width: 1.5; }
      .text-base { font-family: ui-monospace, SFMono-Regular, "Cascadia Code", "Fira Code", Menlo, Consolas, monospace; font-size: 13px; }
      .user { fill: #58a6ff; font-weight: bold; }
      .host { fill: #79c0ff; }
      .divider { fill: #484f58; }
      .key { fill: #51a2da; font-weight: 600; }
      .dots { fill: #30363d; }
      .val { fill: #c9d1d9; }
      .val-accent { fill: #51a2da; font-weight: bold; }
      .val-cyan { fill: #79c0ff; }
      .val-orange { fill: #ffa657; }
      .section-hdr { fill: #ff7b72; font-weight: bold; }
      
      .fedora-glow { filter: drop-shadow(0 0 12px rgba(81, 162, 218, 0.45)); }
    </style>
    
    <!-- Fedora Official Brand Gradients -->
    <linearGradient id="fedoraNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c325c" />
      <stop offset="100%" stop-color="#294172" />
    </linearGradient>

    <linearGradient id="fedoraBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3c6eb4" />
      <stop offset="100%" stop-color="#51a2da" />
    </linearGradient>

    <linearGradient id="fedoraCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#51a2da" />
      <stop offset="100%" stop-color="#79c0ff" />
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect width="880" height="430" class="bg" />

  <!-- Terminal Window Controls -->
  <circle cx="28" cy="24" r="5.5" fill="#ff5f56" />
  <circle cx="46" cy="24" r="5.5" fill="#ffbd2e" />
  <circle cx="64" cy="24" r="5.5" fill="#27c93f" />
  <text x="440" y="28" fill="#8b949e" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle" letter-spacing="1.5">SATYANSH // FASTFETCH (FEDORA)</text>
  <line x1="16" y1="44" x2="864" y2="44" stroke="#21262d" stroke-width="1" />

  <!-- LEFT: Authentic Fedora Fastfetch Infinity Logo -->
  <g transform="translate(45, 75)" class="fedora-glow">
    <!-- Outer Fedora Container -->
    <rect x="0" y="0" width="220" height="270" rx="28" fill="url(#fedoraNavy)" stroke="#3c6eb4" stroke-width="2" />
    
    <!-- Decorative Corner Accents -->
    <path d="M 20 20 L 60 20 M 20 250 L 60 250 M 200 20 L 160 20 M 200 250 L 160 250" stroke="#51a2da" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    
    <!-- Fedora Infinity Loops -->
    <g transform="translate(10, 20)">
      <!-- Left Loop Segment -->
      <path d="M 85,150 
               C 50,150 25,125 25,90 
               C 25,55 50,30 85,30 
               C 120,30 145,55 145,90 
               C 145,125 120,150 85,150 Z" 
            fill="none" stroke="url(#fedoraBlue)" stroke-width="28" stroke-linecap="round" />
      
      <!-- Right Loop Segment (Cyan) -->
      <path d="M 115,190 
               C 80,190 55,165 55,130 
               C 55,95 80,70 115,70 
               C 150,70 175,95 175,130 
               C 175,165 150,190 115,190 Z" 
            fill="none" stroke="url(#fedoraCyan)" stroke-width="28" stroke-linecap="round" />

      <!-- Center 'f' infinity bridge (White) -->
      <path d="M 100,45 
               C 75,45 58,62 58,87 
               L 58,165 
               C 58,178 68,188 81,188 
               L 81,188 
               C 94,188 104,178 104,165 
               L 104,115 
               L 142,115 
               C 155,115 165,105 165,92 
               L 165,92 
               C 165,79 155,69 142,69 
               L 104,69 
               L 104,87 
               C 104,75 113,65 125,65
               C 137,65 147,75 147,87" 
            fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
      
      <line x1="68" y1="108" x2="138" y2="108" stroke="#ffffff" stroke-width="14" stroke-linecap="round" />
    </g>

    <!-- Fedora Subtitle Tag -->
    <rect x="45" y="232" width="130" height="22" rx="11" fill="#0d1117" stroke="#51a2da" stroke-width="1" />
    <text x="110" y="247" fill="#51a2da" font-family="ui-monospace, monospace" font-size="10.5" font-weight="bold" text-anchor="middle" letter-spacing="1">FEDORA 41</text>
  </g>

  <!-- RIGHT: Exact Previous Fastfetch Data -->
  <g transform="translate(315, 68)" class="text-base">
    <!-- User & Host Header -->
    <text x="0" y="16">
      <tspan class="user">satyansh</tspan><tspan class="host">@fedora-rtx</tspan>
      <tspan class="divider"> ------------------------------------------</tspan>
    </text>

    <!-- System Info Rows -->
    <text x="0" y="40">
      <tspan class="key">. OS</tspan><tspan class="dots">: .................. </tspan><tspan class="val">Fedora Linux x86_64</tspan>
    </text>
    <text x="0" y="60">
      <tspan class="key">. Host</tspan><tspan class="dots">: ................ </tspan><tspan class="val-cyan">satyansh.indevs.in</tspan>
    </text>
    <text x="0" y="80">
      <tspan class="key">. Role</tspan><tspan class="dots">: ................ </tspan><tspan class="val">AI Infra // Systems // Perf Architect</tspan>
    </text>
    <text x="0" y="100">
      <tspan class="key">. Kernel</tspan><tspan class="dots">: .............. </tspan><tspan class="val">quant-6.13.0-cxx-cuda</tspan>
    </text>
    <text x="0" y="120">
      <tspan class="key">. Uptime</tspan><tspan class="dots">: .............. </tspan><tspan class="val-orange">24/7 (caffeine-driven)</tspan>
    </text>
    <text x="0" y="140">
      <tspan class="key">. Shell</tspan><tspan class="dots">: ............... </tspan><tspan class="val">zsh / fish</tspan>
    </text>
    <text x="0" y="160">
      <tspan class="key">. CPU</tspan><tspan class="dots">: ................. </tspan><tspan class="val">brain @ 4.8M thoughts/s</tspan>
    </text>
    <text x="0" y="180">
      <tspan class="key">. Memory</tspan><tspan class="dots">: .............. </tspan><tspan class="val-accent">16GB (strictly cache-aligned)</tspan>
    </text>

    <!-- Stack & Focus -->
    <text x="0" y="210">
      <tspan class="key">. Languages</tspan><tspan class="dots">: ........... </tspan><tspan class="val">C++20, CUDA C, Python, Rust, Java</tspan>
    </text>
    <text x="0" y="232">
      <tspan class="key">. Focus</tspan><tspan class="dots">: ............... </tspan><tspan class="val-cyan">GPU Kernels, SLM Inference, HPC Systems</tspan>
    </text>

    <!-- Contact & Socials -->
    <text x="0" y="264">
      <tspan class="section-hdr">- Contact</tspan><tspan class="divider"> ---------------------------------------</tspan>
    </text>
    <text x="0" y="286">
      <tspan class="key">. Email</tspan><tspan class="dots">: ............... </tspan><tspan class="val">satyanshgaur0@gmail.com</tspan>
    </text>
    <text x="0" y="308">
      <tspan class="key">. LinkedIn</tspan><tspan class="dots">: ............ </tspan><tspan class="val-cyan">linkedin.com/in/satyansh-gaur-2b1b05370</tspan>
    </text>
    <text x="0" y="330">
      <tspan class="key">. GitHub</tspan><tspan class="dots">: .............. </tspan><tspan class="val-cyan">github.com/Satyanshgaur</tspan>
    </text>

    <!-- Terminal Color Blocks -->
    <g transform="translate(0, 350)">
      <rect x="0" y="0" width="20" height="9" fill="#294172" rx="2" />
      <rect x="24" y="0" width="20" height="9" fill="#3c6eb4" rx="2" />
      <rect x="48" y="0" width="20" height="9" fill="#51a2da" rx="2" />
      <rect x="72" y="0" width="20" height="9" fill="#79c0ff" rx="2" />
      <rect x="96" y="0" width="20" height="9" fill="#7ee787" rx="2" />
      <rect x="120" y="0" width="20" height="9" fill="#ffa657" rx="2" />
      <rect x="144" y="0" width="20" height="9" fill="#ff7b72" rx="2" />
      <rect x="168" y="0" width="20" height="9" fill="#f0f6fc" rx="2" />
    </g>
  </g>
</svg>
